name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cowrywise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cowrywise_ci?schema=public
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret-not-used-anywhere-real-32chars
      ACCESS_TOKEN_TTL_SECONDS: 3600
      REFRESH_TOKEN_TTL_SECONDS: 604800
      RESET_PASSWORD_TOKEN_TTL_SECONDS: 900
      PAYSTACK_SECRET_KEY: ci_paystack_key_never_actually_called
      MAILTRAP_HOST: sandbox.smtp.mailtrap.io
      MAILTRAP_PORT: 2525
      MAILTRAP_USER: ci_user_never_actually_called
      MAILTRAP_PASS: ci_pass_never_actually_called
      MAIL_FROM: "Cowrywise CI <noreply@cowrywise.test>"
      ALLOWED_ORIGINS: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npx jest --runInBand
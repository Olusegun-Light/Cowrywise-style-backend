services:
  cowrywise-backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cowrywise-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres@host.docker.internal:5432/cowrywise_dev?schema=public
      - REDIS_URL=redis://host.docker.internal:6379
      - RABBITMQ_URL=amqp://guest:guest@host.docker.internal:5672
      - TRUST_PROXY=true
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "logging.app=cowrywise-backend"
    networks:
      - cowrywise-backend-dev

  nginx:
    image: nginx:alpine
    container_name: cowrywise-nginx
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cowrywise-backend-dev
    networks:
      - cowrywise-backend-dev

  loki:
    image: grafana/loki:latest
    container_name: cowrywise-loki
    restart: unless-stopped
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - cowrywise-backend-dev

  prometheus:
    image: prom/prometheus:latest
    container_name: cowrywise-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    networks:
      - cowrywise-backend-dev

  promtail:
    image: grafana/promtail:latest
    container_name: cowrywise-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cowrywise-backend-dev

  grafana:
    image: grafana/grafana:latest
    container_name: cowrywise-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_EXPOSED_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_EMAIL}
      - GF_SECURITY_ADMIN_EMAIL=${GRAFANA_ADMIN_EMAIL}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - cowrywise-backend-dev

networks:
  cowrywise-backend-dev:
    driver: bridge

volumes:
  loki_data:
  grafana_data:
  prometheus_data:
